[package]
name = "mangareeda-ocr-windows"
version = "0.1.0"
edition = "2024"
description = "MangaReeda OCR plugin that reads page images with the OCR built into Windows"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "Win32_System_WinRT",
] }
