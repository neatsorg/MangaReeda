[package]
name = "mangareeda-dropbox"
version = "0.1.0"
edition = "2024"
description = "MangaReeda plugin that browses and downloads books from Dropbox"
license = "Apache-2.0"

[dependencies]
ureq = { version = "3.1.0", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
base64 = "0.23.1"
getrandom = "0.3.4"
