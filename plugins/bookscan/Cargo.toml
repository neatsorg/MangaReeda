[package]
name = "mangareeda-bookscan"
version = "0.1.0"
edition = "2024"
description = "MangaReeda plugin that lists and downloads books from the BOOKSCAN bookshelf"
license = "Apache-2.0"

[dependencies]
ureq = { version = "3.1.0", features = ["cookies"] }
scraper = "0.24.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mangareeda-plugin-common = { path = "../common" }
